name: Scorecard
# OpenSSF Scorecard, published to api.scorecard.dev for the README badge and sent to code
# scanning. It runs only once the repository is public, like CodeQL. Publishing
# results restricts this file: no env or defaults at the top or in the job, no write
# permission at the workflow level, id-token: write only in this job, and only the checkout,
# scorecard, upload-artifact and upload-sarif steps. Not part of ci-ok.
on:
  push:
    branches: [main]
  schedule:
    - cron: "29 5 * * 2"
  branch_protection_rule:
  workflow_dispatch:
permissions: {}
concurrency:
  group: scorecard-${{ github.ref }}
  cancel-in-progress: true
jobs:
  analysis:
    if: ${{ (github.event_name == 'schedule' && vars.PUBLIC_REPOSITORY == 'true') || (github.event_name != 'schedule' && github.event.repository.private == false) }}
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      actions: read
      security-events: write
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ossf/scorecard-action@2d1146689b8cda280b9bc96326124645441f03bc # v2.4.4
        with:
          results_file: results.sarif
          results_format: sarif
          publish_results: true
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: scorecard-sarif
          path: results.sarif
          retention-days: 5
      - uses: github/codeql-action/upload-sarif@2892aa5e19bbd11bc0cff5427e3b750a04d9e3c2 # v4.38.2
        with:
          sarif_file: results.sarif
