name: Scorecard
# OpenSSF Scorecard, published to api.scorecard.dev for the README badge and sent to code
# scanning. It runs only once the repository is public, like CodeQL. Publishing
# results restricts this file: no env or defaults at the top or in the job, no write
# permission at the workflow level, id-token: write only in this job, and only the checkout,
# scorecard, upload-artifact and upload-sarif steps. Not part of ci-ok.
on:
  push:
    branches: [main]
  schedule:
    - cron: "29 5 * * 2"
  branch_protection_rule:
  workflow_dispatch:
permissions: {}
concurrency:
  group: scorecard-${{ github.ref }}
  cancel-in-progress: true
jobs:
  analysis:
    if: ${{ (github.event_name == 'schedule' && vars.PUBLIC_REPOSITORY == 'true') || (github.event_name != 'schedule' && github.event.repository.private == false) }}
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      actions: read
      security-events: write
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ossf/scorecard-action@fa7117db83c52d787ae5a89f350999701505d78e # v2.5.0
        with:
          results_file: results.sarif
          results_format: sarif
          publish_results: true
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: scorecard-sarif
          path: results.sarif
          retention-days: 5
      - uses: github/codeql-action/upload-sarif@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4.39.1
        with:
          sarif_file: results.sarif
