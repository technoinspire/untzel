name: CodeQL
# CodeQL of the workflows, the TypeScript and the Rust, without a build. Code
# scanning is not available for a private repository on the free plan, so the job runs only
# once the repository is public: a schedule event carries no repository, so it reads the
# PUBLIC_REPOSITORY variable instead. Not part of ci-ok.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: "17 4 * * 1"
  # The first analysis, right after the repository opens (tools/public-flip.sh after-public).
  workflow_dispatch:
permissions: {}
concurrency:
  group: codeql-${{ github.ref }}
  cancel-in-progress: true
jobs:
  analyze:
    if: ${{ (github.event_name == 'schedule' && vars.PUBLIC_REPOSITORY == 'true') || (github.event_name != 'schedule' && github.event.repository.private == false) }}
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      security-events: write
      actions: read
    strategy:
      fail-fast: false
      matrix:
        language: [actions, javascript-typescript, rust]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: github/codeql-action/init@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4.39.1
        with:
          languages: ${{ matrix.language }}
          build-mode: none
      - uses: github/codeql-action/analyze@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4.39.1
        with:
          category: /language:${{ matrix.language }}
