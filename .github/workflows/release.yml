name: Release
# Versions and releases. Only a tag vX.Y.Z on a commit of main publishes; merges never do.
# This workflow never deploys and holds no cloud credential: it builds the static package (app/, docs/, license notices), publishes it as
# a GitHub release with its SHA-256 manifest and tells the site with a repository_dispatch.
# Rehearsal: workflow_dispatch on any branch runs every gate on the branch HEAD and
# packages the same bytes as v0.0.0, uploads the artifact and sends untzel-release-rehearsal.
# A rehearsal never creates a tag, never publishes a GitHub release and never deploys:
# publish runs only on a tag push.
#   build        contents: read, no secret: gates and packaging (the only job running repo code)
#   publish      contents: write, GITHUB_TOKEN only: the GitHub release (tag push only)
#   notify-site  no GITHUB_TOKEN permission: the dispatch GitHub App, target from vars.SITE_REPOSITORY
on:
  push:
    tags: ["v*.*.*"]
  workflow_dispatch:
permissions: {}
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false
env:
  PNPM_VERSION: 12.8.1
jobs:
  build:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    outputs:
      tag: ${{ steps.version.outputs.tag }}
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.ref }}
          fetch-depth: 0
          persist-credentials: false
      - name: Source commit and tag (a tag on main, or a branch rehearsed as v0.0.0)
        id: source
        env:
          EVENT_NAME: ${{ github.event_name }}
        run: |
          commit="$(git rev-parse 'HEAD^{commit}')"
          if [ "$EVENT_NAME" = push ]; then
            # v0.0.0 is the rehearsal's; the glob v*.*.* also lets non-SemVer tags in.
            if [ "$GITHUB_REF_NAME" = v0.0.0 ] || ! [[ "$GITHUB_REF_NAME" =~ ^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]; then
              echo "::error title=Not a release tag::$GITHUB_REF_NAME is not a release tag. Push vMAJOR.MINOR.PATCH; v0.0.0 is reserved for the rehearsal."
              exit 1
            fi
            source=tag
            if ! git merge-base --is-ancestor "$commit" origin/main; then
              echo "::error title=Tag outside main::$GITHUB_REF_NAME points to $commit, which is not on main. Tag a commit of main."
              exit 1
            fi
            tag="$GITHUB_REF_NAME"
          elif [ "$EVENT_NAME" = workflow_dispatch ] && [[ "$GITHUB_REF" == refs/heads/* ]]; then
            source=rehearsal
            tag=v0.0.0
            echo "::notice title=Rehearsal::Packaging $GITHUB_REF at $commit as $tag. No tag, no GitHub release, no deploy."
          else
            echo "::error title=Not a release::$EVENT_NAME on $GITHUB_REF. Push a tag vX.Y.Z, or run the rehearsal on a branch."
            exit 1
          fi
          {
            echo "commit=$commit"
            echo "tag=$tag"
            echo "source=$source"
          } >> "$GITHUB_OUTPUT"
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
      - name: Install pnpm
        run: npm install -g "pnpm@$PNPM_VERSION"
      - name: Install the pinned Rust toolchain
        run: rustup toolchain install
      - run: pnpm install --frozen-lockfile
      - name: Release version from the tag (stable SemVer only)
        id: version
        env:
          TAG: ${{ steps.source.outputs.tag }}
          SOURCE: ${{ steps.source.outputs.source }}
        run: node tools/release/bin/release.mjs version --tag "$TAG" --source "$SOURCE" >> "$GITHUB_OUTPUT"
      - run: pnpm check
      # Help → About shows the tag's version (apps/web/build/app-version.ts).
      - run: pnpm build
        env:
          UNTZEL_VERSION: ${{ steps.version.outputs.version }}
      - name: The DSP WASM imports nothing
        run: pnpm check:wasm
      - run: pnpm budgets
      - name: Golden files of every template (schedule and sound)
        run: pnpm sim:golden
      - name: Package the release (archive, manifest, dispatch body)
        env:
          COMMIT: ${{ steps.source.outputs.commit }}
          TAG: ${{ steps.version.outputs.tag }}
        run: |
          node tools/release/bin/release.mjs package \
            --tag "$TAG" \
            --commit "$COMMIT" \
            --created-at "$(git show -s --format=%cI "$COMMIT")" \
            --repository "$GITHUB_REPOSITORY" \
            --app apps/web/dist \
            --docs apps/web/dist/docs \
            --out .cache/release
      - name: Rehearsal notice for the site (repository_dispatch untzel-release-rehearsal)
        if: github.event_name == 'workflow_dispatch'
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          node tools/release/bin/release.mjs rehearsal-notice \
            --manifest ".cache/release/untzel-$VERSION.manifest.json" \
            --run-id "$GITHUB_RUN_ID" \
            --ref "$GITHUB_REF" \
            --repository "$GITHUB_REPOSITORY" \
            --out ".cache/release/untzel-$VERSION.rehearsal.json"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release
          path: .cache/release/
          if-no-files-found: error
          retention-days: 7

  publish:
    needs: build
    if: github.event_name == 'push'
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    env:
      TAG: ${{ needs.build.outputs.tag }}
      VERSION: ${{ needs.build.outputs.version }}
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: release
          path: release
      - name: The archive matches its manifest
        run: |
          archive="release/untzel-$VERSION.tar.gz"
          manifest="release/untzel-$VERSION.manifest.json"
          actual="$(sha256sum "$archive" | cut -d ' ' -f 1)"
          expected="$(jq -r .archiveSha256 "$manifest")"
          if [ "$actual" != "$expected" ] || [ "$(jq -r .tag "$manifest")" != "$TAG" ]; then
            echo "::error title=Manifest mismatch::$archive has SHA-256 $actual; the manifest says $expected for tag $(jq -r .tag "$manifest")."
            exit 1
          fi
      - name: Create the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$TAG" \
            "release/untzel-$VERSION.tar.gz" \
            "release/untzel-$VERSION.manifest.json" \
            --repo "$GITHUB_REPOSITORY" \
            --verify-tag \
            --title "Untzel $TAG" \
            --generate-notes

  notify-site:
    needs: [build, publish]
    if: ${{ !cancelled() && needs.build.result == 'success' && (needs.publish.result == 'success' || (github.event_name == 'workflow_dispatch' && needs.publish.result == 'skipped')) }}
    runs-on: ubuntu-24.04
    permissions: {}
    env:
      SITE_REPOSITORY: ${{ vars.SITE_REPOSITORY }}
      HAS_APP_ID: ${{ secrets.SITE_DISPATCH_APP_ID != '' }}
      HAS_APP_KEY: ${{ secrets.SITE_DISPATCH_APP_PRIVATE_KEY != '' }}
      VERSION: ${{ needs.build.outputs.version }}
      EVENT_NAME: ${{ github.event_name }}
    steps:
      - name: Site repository to notify
        id: target
        run: |
          if [ -z "$SITE_REPOSITORY" ] || [ "$HAS_APP_ID" != true ] || [ "$HAS_APP_KEY" != true ]; then
            echo "::notice title=Site not notified::The release (or rehearsal) is packaged. Set the variable SITE_REPOSITORY and the secrets SITE_DISPATCH_APP_ID and SITE_DISPATCH_APP_PRIVATE_KEY to notify the site."
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if ! [[ "$SITE_REPOSITORY" =~ ^[A-Za-z0-9][A-Za-z0-9-]*/[A-Za-z0-9._-]+$ ]]; then
            echo "::error title=Invalid SITE_REPOSITORY::Expected owner/name."
            exit 1
          fi
          {
            echo "enabled=true"
            echo "owner=${SITE_REPOSITORY%%/*}"
            echo "name=${SITE_REPOSITORY#*/}"
          } >> "$GITHUB_OUTPUT"
      - name: Token of the dispatch GitHub App (Contents write on the site only)
        id: app-token
        if: steps.target.outputs.enabled == 'true'
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          app-id: ${{ secrets.SITE_DISPATCH_APP_ID }}
          private-key: ${{ secrets.SITE_DISPATCH_APP_PRIVATE_KEY }}
          owner: ${{ steps.target.outputs.owner }}
          repositories: ${{ steps.target.outputs.name }}
          permission-contents: write
      - if: steps.target.outputs.enabled == 'true'
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: release
          path: release
      - name: Notify the site (untzel-release, or untzel-release-rehearsal for a rehearsal)
        if: steps.target.outputs.enabled == 'true'
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
        run: |
          if [ "$EVENT_NAME" = workflow_dispatch ]; then
            body="release/untzel-$VERSION.rehearsal.json"
          else
            body="release/untzel-$VERSION.dispatch.json"
          fi
          gh api --method POST "repos/$SITE_REPOSITORY/dispatches" --input "$body"
