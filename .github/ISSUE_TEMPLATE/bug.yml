name: Bug report
description: Something in Untzel does not work as it should.
title: "[Bug]: "
labels: [bug, triage]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to report this. Security problems go through a private report instead: see [SECURITY.md](https://github.com/technoinspire/untzel/blob/main/SECURITY.md).
  - type: textarea
    id: description
    attributes:
      label: What happened
      description: A clear description of the problem.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Open a template
        2. Tap Code and change ...
        3. See ...
    validations:
      required: true
  - type: dropdown
    id: where
    attributes:
      label: Where does it run
      options:
        - The hosted app (app.untzel.com, after launch)
        - My own copy
        - Local development
    validations:
      required: true
  - type: input
    id: browser
    attributes:
      label: Browser and version
      placeholder: Chrome 154, Safari 26, Firefox 155
    validations:
      required: true
  - type: textarea
    id: code
    attributes:
      label: Untzel code that reproduces it
      description: The smallest text that shows the problem, if there is one.
      render: text
  - type: textarea
    id: expected
    attributes:
      label: Expected and actual result
      placeholder: |
        Expected: ...
        Actual: ...
  - type: input
    id: device
    attributes:
      label: Device and operating system
      placeholder: Pixel 8, Android 16; MacBook Air, macOS 26
  - type: textarea
    id: capture
    attributes:
      label: Screenshot or recording
      description: Drag an image or a short video here.
  - type: checkboxes
    id: checks
    attributes:
      label: Before you send
      options:
        - label: I searched the open and closed issues and found no report of this.
          required: true
        - label: This is not a security problem (those go to SECURITY.md).
          required: true
